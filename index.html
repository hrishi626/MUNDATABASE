<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Israel–Iran MUN Research Database</title>

<style>

:root {
    --background: #0b1120;
    --background-secondary: #111827;
    --card: #172033;
    --card-hover: #1d293d;
    --text: #f1f5f9;
    --text-secondary: #cbd5e1;
    --muted: #94a3b8;
    --border: #263449;

    --blue: #60a5fa;
    --blue-dark: #2563eb;
    --blue-light: #172554;

    --red: #f87171;
    --red-light: #3f1d24;

    --orange: #fb923c;
    --orange-light: #431f13;

    --green: #34d399;
    --green-light: #12352e;

    --purple: #c084fc;
    --purple-light: #32164d;

    --shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    background: #0f172a;
    border-bottom: 1px solid var(--border);
    padding: 30px 20px;
}

.header-inner {
    max-width: 1250px;
    margin: auto;
}

h1 {
    margin: 0;
    font-size: 30px;
    color: #f8fafc;
}

.subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 15px;
}

/* SEARCH */

.search-area {
    max-width: 1250px;
    margin: 24px auto 0;
    padding: 0 20px;
}

.search-row {
    display: flex;
    gap: 10px;
}

#searchInput {
    flex: 1;
    padding: 15px;
    background: #111827;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

#searchInput::placeholder {
    color: #64748b;
}

#searchInput:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
}

#searchButton {
    padding: 0 22px;
    background: var(--blue-dark);
    color: white;
}

#searchButton:hover {
    background: #3b82f6;
}

#clearButton {
    padding: 0 18px;
    background: #273449;
    color: var(--text-secondary);
}

#clearButton:hover {
    background: #334155;
}

button {
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

.search-explanation {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
}

code {
    background: #1e293b;
    color: #93c5fd;
    padding: 3px 6px;
    border-radius: 4px;
}

/* QUICK SEARCHES */

.quick-searches {
    max-width: 1250px;
    margin: 14px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.quick-search {
    padding: 8px 13px;
    background: #172033;
    border: 1px solid var(--border);
    color: var(--text-secondary);
}

.quick-search:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: #1e293b;
}

/* MAIN */

main {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 20px;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

#resultCount {
    color: var(--muted);
    font-size: 14px;
}

/* CARDS */

.incident-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
}

.incident-card:hover {
    border-color: #3b82f6;
    background: var(--card-hover);
}

.card-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.incident-title {
    margin: 0;
    font-size: 21px;
    color: #f8fafc;
}

.incident-meta {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
}

/* STATUS */

.status {
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 12px;
    height: fit-content;
    white-space: nowrap;
}

.status-confirmed {
    background: var(--green-light);
    color: var(--green);
}

.status-allegation {
    background: var(--orange-light);
    color: var(--orange);
}

.status-disputed {
    background: var(--red-light);
    color: var(--red);
}

.status-legal {
    background: var(--purple-light);
    color: var(--purple);
}

/* TAGS */

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 15px;
}

.tag {
    background: var(--blue-light);
    color: #93c5fd;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
}

/* SUMMARY */

.summary {
    margin-top: 17px;
    line-height: 1.65;
    color: var(--text-secondary);
}

/* DETAILS */

.view-button {
    margin-top: 18px;
    padding: 10px 15px;
    background: #2563eb;
    color: white;
}

.view-button:hover {
    background: #3b82f6;
}

.details {
    display: none;
    border-top: 1px solid var(--border);
    margin-top: 22px;
    padding-top: 22px;
}

.details.open {
    display: block;
}

.section {
    margin-bottom: 27px;
}

.section h3 {
    margin-bottom: 11px;
    font-size: 17px;
    color: #f8fafc;
}

.section p {
    line-height: 1.65;
    color: var(--text-secondary);
}

/* FACT BOX */

.fact-box {
    background: #111827;
    border: 1px solid var(--border);
    padding: 15px;
    border-radius: 9px;
    line-height: 1.65;
    color: var(--text-secondary);
}

/* VICTIMS */

.victim {
    background: var(--orange-light);
    border-left: 4px solid var(--orange);
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 9px;
    line-height: 1.55;
    color: #fed7aa;
}

/* LEGAL CARDS */

.legal-card {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 15px;
    margin-bottom: 10px;
}

.legal-heading {
    font-weight: bold;
    color: #93c5fd;
}

.legal-provision {
    margin-top: 7px;
    font-weight: bold;
    color: #f1f5f9;
}

.legal-application {
    margin-top: 8px;
    line-height: 1.6;
    color: var(--text-secondary);
}

.legal-status {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
}

/* SOURCES */

.source {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px;
    margin-bottom: 8px;
}

.source-organisation {
    font-weight: bold;
    color: #f8fafc;
}

.source-title {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
}

.source a {
    color: var(--blue);
    text-decoration: none;
    white-space: nowrap;
}

.source a:hover {
    text-decoration: underline;
}

/* POIs */

.poi {
    background: var(--blue-light);
    border-left: 4px solid var(--blue);
    padding: 14px;
    margin-bottom: 10px;
    line-height: 1.6;
    color: #dbeafe;
}

/* FOLLOW-UP */

.follow-up {
    background: var(--red-light);
    border-left: 4px solid var(--red);
    padding: 14px;
    line-height: 1.6;
    color: #fecaca;
}

/* EMPTY */

.empty {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: var(--muted);
}

/* MOBILE */

@media (max-width: 700px) {

    .search-row {
        flex-direction: column;
    }

    #searchButton,
    #clearButton {
        padding: 12px;
    }

    .card-header {
        flex-direction: column;
    }

    .source {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>
</head>

            law:
            "International Humanitarian Law",

            article:
            "Distinction",

            provision:

            "Parties must distinguish between civilian objects and military objectives.",

            application:

            "The use of missiles against populated areas raises questions concerning whether the attacks were directed at lawful military objectives.",

            status:

            "Must be assessed on an incident-by-incident basis."

        },


        {

            law:
            "International Humanitarian Law",

            article:
            "Proportionality",

            provision:

            "Expected civilian harm must not be excessive in relation to the anticipated military advantage.",

            application:

            "Where attacks affected populated areas, the expected civilian consequences and the anticipated military advantage are relevant to legal assessment.",

            status:

            "Requires investigation of individual strikes."

        }

    ],


    sources: [

        {

            organisation:
            "Amnesty International",

            title:
            "Urgent need to protect civilians amid unprecedented escalation in hostilities between Israel and Iran",

            url:
            "https://www.amnesty.org/en/latest/news/2025/06/urgent-need-to-protect-civilians-amid-unprecedented-escalation-in-hostilities-between-israel-and-iran/"

        }

    ],


    pois: [

        "What specific military objectives were being targeted in the Iranian missile attacks that caused civilian deaths and damage in Israeli population centres?",

        "What precautions did Iran take to minimise civilian harm when launching missiles toward areas containing civilian populations?"

    ],


    followUp:

    "Will Iran support independent investigations into civilian casualties caused by its attacks during the escalation?"

}

];



/* ============================================================
   SEARCH ENGINE
============================================================ */


const searchInput =
document.getElementById("searchInput");


const searchButton =
document.getElementById("searchButton");


const clearButton =
document.getElementById("clearButton");


const resultsContainer =
document.getElementById("results");


const resultCount =
document.getElementById("resultCount");



function getSearchableText(incident) {

    return JSON.stringify(incident).toLowerCase();

}



function searchDatabase() {

    const query =
    searchInput.value.trim().toLowerCase();


    if (!query) {

        displayResults(incidents);

        return;

    }


    const terms = query

        .split("+")

        .map(term => term.trim())

        .filter(term => term.length > 0);


    const results = incidents.filter(incident => {

        const searchableText =
        getSearchableText(incident);


        return terms.every(term =>

            searchableText.includes(term)

        );

    });


    displayResults(results);

}



function quickSearch(term) {

    searchInput.value = term;

    searchDatabase();

}



function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



function displayResults(results) {

    resultsContainer.innerHTML = "";


    resultCount.textContent =

    `${results.length} result${results.length === 1 ? "" : "s"} found`;


    if (results.length === 0) {

        resultsContainer.innerHTML = `

            <div class="empty">

                <h3>
                    No results found
                </h3>

                <p>
                    Try fewer search terms.
                </p>

                <p>
                    Example:
                    <code>Iran+children</code>
                </p>

            </div>

        `;

        return;

    }


    results.forEach(incident => {


        const card =
        document.createElement("article");


        card.className =
        "incident-card";


        const tagsHTML =

        incident.tags

        .map(tag => `

            <span class="tag">

                ${escapeHTML(tag)}

            </span>

        `)

        .join("");


        const victimsHTML =

        incident.victims

        .map(victim => `

            <div class="victim">

                <strong>

                    ${escapeHTML(victim.name)}

                </strong>

                <br>

                Age:
                ${escapeHTML(victim.age)}

                <br>

                Status:
                ${escapeHTML(victim.status)}

                <br><br>

                ${escapeHTML(victim.details)}

            </div>

        `)

        .join("");


        const legalHTML =

        incident.legalIssues

        .map(issue => `

            <div class="legal-card">

                <div class="legal-heading">

                    ${escapeHTML(issue.law)}

                    —

                    ${escapeHTML(issue.article)}

                </div>


                <div class="legal-provision">

                    ${escapeHTML(issue.provision)}

                </div>


                <div class="legal-application">

                    <strong>
                        How this may apply:
                    </strong>

                    ${escapeHTML(issue.application)}

                </div>


                <div class="legal-status">

                    <strong>
                        Status:
                    </strong>

                    ${escapeHTML(issue.status)}

                </div>

            </div>

        `)

        .join("");


        const sourcesHTML =

        incident.sources

        .map(source => `

            <div class="source">

                <div>

                    <div class="source-organisation">

                        ${escapeHTML(source.organisation)}

                    </div>


                    <div class="source-title">

                        ${escapeHTML(source.title)}

                    </div>

                </div>


                <a

                    href="${source.url}"

                    target="_blank"

                    rel="noopener noreferrer"

                >

                    Open Source

                </a>

            </div>

        `)

        .join("");


        const poisHTML =

        incident.pois

        .map((poi, index) => `

            <div class="poi">

                <strong>

                    POI ${index + 1}

                </strong>

                <br><br>

                ${escapeHTML(poi)}

            </div>

        `)

        .join("");


        card.innerHTML = `

            <div class="card-header">

                <div>

                    <h2 class="incident-title">

                        ${escapeHTML(incident.title)}

                    </h2>


                    <div class="incident-meta">

                        ${escapeHTML(incident.date)}

                        ·

                        ${escapeHTML(incident.location)}

                    </div>

                </div>


                <div class="status ${incident.statusClass}">

                    ${escapeHTML(incident.status)}

                </div>

            </div>


            <div class="tags">

                ${tagsHTML}

            </div>


            <div class="summary">

                ${escapeHTML(incident.summary)}

            </div>


            <button class="view-button">

                View Full Entry

            </button>


            <div class="details">


                <div class="section">

                    <h3>
                        Batch
                    </h3>


                    <p>

                        ${escapeHTML(incident.batch)}

                    </p>

                </div>


                <div class="section">

                    <h3>
                        Detailed Facts
                    </h3>


                    <div class="fact-box">

                        ${escapeHTML(incident.facts)}

                    </div>

                </div>


                <div class="section">

                    <h3>
                        Victims / Persons Affected
                    </h3>


                    ${victimsHTML}

                </div>


                <div class="section">

                    <h3>
                        Legal Issues and Possible Violations
                    </h3>


                    ${legalHTML}

                </div>


                <div class="section">

                    <h3>
                        Sources
                    </h3>


                    ${sourcesHTML}

                </div>


                <div class="section">

                    <h3>
                        POIs
                    </h3>


                    ${poisHTML}

                </div>


                <div class="section">

                    <h3>
                        Follow-Up Question
                    </h3>


                    <div class="follow-up">

                        ${escapeHTML(incident.followUp)}

                    </div>

                </div>

            </div>

        `;


        const viewButton =
        card.querySelector(".view-button");


        const details =
        card.querySelector(".details");


        viewButton.addEventListener("click", () => {


            details.classList.toggle("open");


            viewButton.textContent =

            details.classList.contains("open")

            ? "Hide Full Entry"

            : "View Full Entry";

        });


        resultsContainer.appendChild(card);

    });

}



searchButton.addEventListener(

    "click",

    searchDatabase

);



clearButton.addEventListener(

    "click",

    () => {

        searchInput.value = "";

        displayResults(incidents);

    }

);



searchInput.addEventListener(

    "keydown",

    event => {

        if (event.key === "Enter") {

            searchDatabase();

        }

    }

);



displayResults(incidents);


</script>

</body>

</html>
